<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a33"/>
      <stop offset="0.55" stop-color="#3a3556"/>
      <stop offset="1" stop-color="#b8693a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a52"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#sky)"/>
  <circle cx="610" cy="120" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="180" cy="70" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="420" cy="50" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- far shore with pine trees -->
  <path d="M0 330 L60 300 L80 318 L120 290 L150 315 L200 296 L240 320 L300 305 L360 325 L800 318 L800 360 L0 360 Z" fill="#141b2c"/>
  <rect y="360" width="800" height="240" fill="url(#water)"/>
  <!-- reflection of the sunset -->
  <rect x="340" y="368" width="200" height="3" fill="#d98a4a" opacity="0.5"/>
  <rect x="370" y="385" width="140" height="2" fill="#d98a4a" opacity="0.35"/>
  <rect x="400" y="402" width="90" height="2" fill="#d98a4a" opacity="0.25"/>
  <!-- burnt remains of a building on the left shore -->
  <path d="M0 420 L0 300 L40 300 L40 260 L70 240 L95 262 L95 300 L150 300 L150 330 L180 315 L210 340 L210 420 Z" fill="#07090f"/>
  <path d="M60 300 L60 330 L80 330 L80 300 Z" fill="#1d1a1c"/>
  <path d="M110 310 L110 340 L132 340 L132 310 Z" fill="#1d1a1c"/>
  <!-- charred pier posts -->
  <g fill="#05070c">
    <rect x="230" y="380" width="8" height="70"/>
    <rect x="275" y="390" width="8" height="64"/>
    <rect x="320" y="398" width="7" height="58"/>
    <rect x="362" y="404" width="7" height="52"/>
    <rect x="400" y="410" width="6" height="46"/>
  </g>
  <rect x="226" y="380" width="70" height="6" fill="#05070c" transform="rotate(4 226 380)"/>
  <!-- reeds in the foreground -->
  <g stroke="#05070c" stroke-width="3" fill="none">
    <path d="M700 600 Q690 520 705 470"/>
    <path d="M720 600 Q725 530 740 490"/>
    <path d="M745 600 Q750 540 770 500"/>
    <path d="M680 600 Q670 540 660 500"/>
  </g>
</svg>
