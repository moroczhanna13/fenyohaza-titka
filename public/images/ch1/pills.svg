<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="kitchen" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#6b5a45"/>
      <stop offset="1" stop-color="#231c15"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#kitchen)"/>
  <!-- oilcloth table -->
  <rect y="300" width="800" height="300" fill="#8c3b32"/>
  <g fill="#a54c41" opacity="0.6">
    <rect x="0" y="300" width="800" height="12"/><rect x="0" y="340" width="800" height="12"/>
    <rect x="0" y="380" width="800" height="12"/><rect x="0" y="420" width="800" height="12"/>
    <rect x="0" y="460" width="800" height="12"/><rect x="0" y="500" width="800" height="12"/>
    <rect x="0" y="540" width="800" height="12"/><rect x="0" y="580" width="800" height="12"/>
  </g>
  <!-- glass of water -->
  <path d="M560 230 L640 230 L630 420 L570 420 Z" fill="#cfe3ec" opacity="0.35" stroke="#e8f2f6" stroke-width="3"/>
  <rect x="573" y="300" width="54" height="118" fill="#9cc3d4" opacity="0.35"/>
  <!-- pill box -->
  <g transform="rotate(-6 340 380)">
    <rect x="170" y="290" width="340" height="170" rx="6" fill="#f4f1ea"/>
    <rect x="170" y="290" width="340" height="40" fill="#c0392b"/>
    <text x="190" y="318" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Amlodipin</text>
    <text x="190" y="378" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#c0392b">10 mg</text>
    <text x="190" y="410" font-family="Arial, sans-serif" font-size="18" fill="#333">tabletta · 30 db</text>
    <!-- pharmacy label -->
    <rect x="330" y="390" width="170" height="58" fill="#fffbe0" stroke="#b7a96a"/>
    <text x="340" y="410" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#222">FENYŐ PATIKA</text>
    <text x="340" y="428" font-family="'Courier New', monospace" font-size="12" fill="#222">Berényi G.</text>
    <text x="340" y="443" font-family="'Courier New', monospace" font-size="12" fill="#222">2026.09.13.</text>
  </g>
  <!-- loose tablets -->
  <circle cx="460" cy="520" r="10" fill="#f6f6f2"/>
  <circle cx="488" cy="530" r="10" fill="#f6f6f2"/>
</svg>
