<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d93c9"/>
      <stop offset="1" stop-color="#bcd7ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- town hall with clock -->
  <rect x="250" y="170" width="300" height="260" fill="#e2d3b3"/>
  <path d="M230 175 L400 90 L570 175 Z" fill="#8a3b2b"/>
  <rect x="370" y="30" width="60" height="110" fill="#e2d3b3"/>
  <path d="M362 35 L400 0 L438 35 Z" fill="#8a3b2b"/>
  <circle cx="400" cy="80" r="20" fill="#f7f2e6" stroke="#6b5a40" stroke-width="3"/>
  <line x1="400" y1="80" x2="400" y2="66" stroke="#2b2b2b" stroke-width="3"/>
  <line x1="400" y1="80" x2="410" y2="80" stroke="#2b2b2b" stroke-width="3"/>
  <g fill="#6f8aa3">
    <rect x="280" y="210" width="40" height="60"/><rect x="380" y="210" width="40" height="60"/><rect x="480" y="210" width="40" height="60"/>
    <rect x="280" y="310" width="40" height="60"/><rect x="480" y="310" width="40" height="60"/>
  </g>
  <rect x="370" y="330" width="60" height="100" fill="#5b3f27"/>
  <!-- flags for the national holiday -->
  <g>
    <line x1="270" y1="170" x2="270" y2="110" stroke="#4a4a4a" stroke-width="3"/>
    <rect x="270" y="110" width="40" height="9" fill="#c8102e"/><rect x="270" y="119" width="40" height="9" fill="#fff"/><rect x="270" y="128" width="40" height="9" fill="#2e7d32"/>
    <line x1="530" y1="170" x2="530" y2="110" stroke="#4a4a4a" stroke-width="3"/>
    <rect x="530" y="110" width="40" height="9" fill="#c8102e"/><rect x="530" y="119" width="40" height="9" fill="#fff"/><rect x="530" y="128" width="40" height="9" fill="#2e7d32"/>
  </g>
  <!-- square and market stalls -->
  <rect y="430" width="800" height="170" fill="#b9ac98"/>
  <g>
    <rect x="40" y="440" width="150" height="80" fill="#f2efe8"/>
    <path d="M30 445 L200 445 L185 410 L45 410 Z" fill="#c0392b"/>
    <rect x="610" y="440" width="150" height="80" fill="#f2efe8"/>
    <path d="M600 445 L770 445 L755 410 L615 410 Z" fill="#2e7d32"/>
  </g>
  <!-- people -->
  <g fill="#2d3640">
    <circle cx="300" cy="480" r="10"/><rect x="292" y="490" width="16" height="40" rx="6"/>
    <circle cx="460" cy="490" r="10"/><rect x="452" y="500" width="16" height="40" rx="6"/>
    <circle cx="520" cy="470" r="9"/><rect x="513" y="479" width="14" height="36" rx="6"/>
  </g>
</svg>
