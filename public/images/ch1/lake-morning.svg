<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb4d9"/>
      <stop offset="1" stop-color="#e8d9c0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9fbd"/>
      <stop offset="1" stop-color="#2f5270"/>
    </linearGradient>
  </defs>
  <rect width="800" height="330" fill="url(#sky)"/>
  <!-- morning mist over the far shore -->
  <path d="M0 300 L50 270 L90 290 L140 262 L190 288 L250 270 L320 292 L420 276 L520 290 L620 268 L700 286 L800 274 L800 330 L0 330 Z" fill="#4e6b5c"/>
  <rect y="285" width="800" height="30" fill="#f2ebe0" opacity="0.45"/>
  <rect y="330" width="800" height="270" fill="url(#water)"/>
  <!-- beach and lifeguard tower -->
  <path d="M0 470 Q300 430 800 455 L800 600 L0 600 Z" fill="#d8c49a"/>
  <g fill="#a33b2c">
    <rect x="560" y="330" width="70" height="40"/>
  </g>
  <g stroke="#6b4a2f" stroke-width="6">
    <line x1="565" y1="370" x2="555" y2="460"/>
    <line x1="625" y1="370" x2="635" y2="460"/>
  </g>
  <path d="M550 330 L595 305 L640 330 Z" fill="#7a2a20"/>
  <!-- buoys -->
  <circle cx="200" cy="380" r="7" fill="#e9a23b"/>
  <circle cx="320" cy="372" r="6" fill="#e9a23b"/>
  <circle cx="440" cy="368" r="5" fill="#e9a23b"/>
  <!-- empty bench -->
  <g fill="#5b4330">
    <rect x="140" y="500" width="160" height="10"/>
    <rect x="140" y="480" width="160" height="8"/>
    <rect x="150" y="510" width="8" height="30"/>
    <rect x="282" y="510" width="8" height="30"/>
  </g>
</svg>
