<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- library notice board -->
  <rect width="800" height="600" fill="#6e5136"/>
  <rect x="40" y="40" width="720" height="520" fill="#b48a5c"/>
  <g fill="#9c7448" opacity="0.6">
    <circle cx="120" cy="120" r="3"/><circle cx="660" cy="480" r="3"/><circle cx="700" cy="140" r="2"/>
  </g>
  <!-- other notices -->
  <rect x="70" y="80" width="150" height="190" fill="#efe8d8" transform="rotate(-3 145 175)"/>
  <rect x="580" y="330" width="150" height="190" fill="#e6eef2" transform="rotate(4 655 425)"/>
  <!-- the old festival poster, faded -->
  <g transform="rotate(-1.5 400 300)">
    <rect x="250" y="70" width="300" height="440" fill="#e9dcc0"/>
    <rect x="270" y="90" width="260" height="250" fill="#3d6f8f" opacity="0.75"/>
    <circle cx="400" cy="190" r="45" fill="#e3a34a" opacity="0.85"/>
    <path d="M270 300 Q330 280 400 300 T530 300 L530 340 L270 340 Z" fill="#244a63" opacity="0.8"/>
    <!-- sailing boat -->
    <path d="M370 290 L400 220 L400 290 Z" fill="#f4efe4"/>
    <path d="M355 292 L430 292 L420 304 L365 304 Z" fill="#5b3a26"/>
    <text x="400" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2b2b2b" opacity="0.85">TAVI FESZTIVÁL</text>
    <text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#a3402c" opacity="0.85">2001</text>
    <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2b2b2b" opacity="0.7">Fenyőházi Vitorlásklub</text>
    <!-- pins -->
    <circle cx="265" cy="82" r="6" fill="#c0392b"/>
    <circle cx="535" cy="82" r="6" fill="#c0392b"/>
  </g>
</svg>
