<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#1b1a33"/>
    </linearGradient>
    <radialGradient id="stageLight" cx="0.2" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#f7c35a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7c35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#d9a441"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- firework bursts -->
  <g stroke="#f2a93b" stroke-width="2" opacity="0.8">
    <line x1="230" y1="90" x2="230" y2="50"/><line x1="230" y1="90" x2="262" y2="66"/><line x1="230" y1="90" x2="270" y2="98"/>
    <line x1="230" y1="90" x2="258" y2="122"/><line x1="230" y1="90" x2="200" y2="122"/><line x1="230" y1="90" x2="190" y2="96"/>
    <line x1="230" y1="90" x2="198" y2="62"/>
  </g>
  <g stroke="#7fc4e8" stroke-width="2" opacity="0.6">
    <line x1="120" y1="140" x2="120" y2="112"/><line x1="120" y1="140" x2="144" y2="128"/><line x1="120" y1="140" x2="142" y2="160"/>
    <line x1="120" y1="140" x2="98" y2="160"/><line x1="120" y1="140" x2="96" y2="126"/>
  </g>
  <!-- lake strip -->
  <rect y="330" width="800" height="40" fill="#0d1428"/>
  <!-- stage on the left, glowing -->
  <rect width="800" height="600" fill="url(#stageLight)"/>
  <rect x="40" y="260" width="250" height="90" fill="#2a2030"/>
  <rect x="40" y="250" width="250" height="12" fill="#4a3a52"/>
  <g fill="#ffd27a"><circle cx="70" cy="256" r="5"/><circle cx="130" cy="256" r="5"/><circle cx="190" cy="256" r="5"/><circle cx="250" cy="256" r="5"/></g>
  <!-- club house in the background on the right, office window lit -->
  <path d="M500 330 L500 250 L560 215 L700 215 L760 250 L760 330 Z" fill="#141a2a"/>
  <rect x="540" y="265" width="44" height="32" fill="url(#window)"/>
  <rect x="660" y="265" width="44" height="32" fill="#0a0e18"/>
  <text x="600" y="243" font-family="Arial, sans-serif" font-size="11" fill="#3b4560">VITORLÁSKLUB</text>
  <!-- parked red car beside the club, plate readable when zoomed -->
  <g>
    <path d="M610 352 L622 330 L668 328 L684 344 L708 346 L710 362 L606 364 Z" fill="#a3221c"/>
    <path d="M626 333 L644 333 L644 344 L620 344 Z" fill="#26324a"/>
    <path d="M648 333 L666 332 L678 344 L648 344 Z" fill="#26324a"/>
    <circle cx="628" cy="364" r="8" fill="#0b0b0b"/>
    <circle cx="690" cy="364" r="8" fill="#0b0b0b"/>
    <rect x="667" y="348" width="42" height="14" fill="#f2f2f2" stroke="#222" stroke-width="0.8"/>
    <text x="688" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#111">GBM-418</text>
  </g>
  <!-- crowd silhouettes in the foreground -->
  <g fill="#06070c">
    <path d="M0 600 L0 470 Q20 440 45 455 Q60 420 90 440 Q110 410 140 438 Q165 420 185 450 Q215 425 240 455 Q265 430 295 458 Q320 440 345 470 Q370 445 400 475 L400 600 Z"/>
    <path d="M380 600 L390 490 Q420 460 450 485 Q480 455 510 482 Q545 465 570 495 Q600 470 630 500 Q665 480 690 510 Q720 490 760 515 L800 520 L800 600 Z"/>
    <circle cx="90" cy="430" r="16"/><circle cx="185" cy="438" r="15"/><circle cx="300" cy="446" r="15"/>
    <circle cx="455" cy="474" r="16"/><circle cx="565" cy="484" r="15"/><circle cx="690" cy="498" r="15"/>
  </g>
  <!-- camera date stamp -->
  <text x="770" y="580" text-anchor="end" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#ff8c1a" opacity="0.9">'01 7 21  23:05</text>
</svg>
