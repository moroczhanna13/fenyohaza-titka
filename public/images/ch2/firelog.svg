<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#3a2f25"/>
  <g transform="rotate(-2 400 300)">
    <rect x="70" y="40" width="660" height="520" fill="#e9e2cf"/>
    <!-- ruled lines -->
    <g stroke="#b8c4d6" stroke-width="1">
      <line x1="70" y1="130" x2="730" y2="130"/><line x1="70" y1="180" x2="730" y2="180"/>
      <line x1="70" y1="230" x2="730" y2="230"/><line x1="70" y1="280" x2="730" y2="280"/>
      <line x1="70" y1="330" x2="730" y2="330"/><line x1="70" y1="380" x2="730" y2="380"/>
      <line x1="70" y1="430" x2="730" y2="430"/><line x1="70" y1="480" x2="730" y2="480"/>
    </g>
    <line x1="170" y1="40" x2="170" y2="560" stroke="#d48a8a" stroke-width="1.5"/>
    <text x="400" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2b2b2b">FENYŐHÁZI ÖNKÉNTES TŰZOLTÓSÁG – ESEMÉNYNAPLÓ</text>
    <g font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="21" fill="#1f2f5a">
      <text x="85" y="122">2001.</text><text x="185" y="122">VII. 21. (szombat)</text>
      <text x="85" y="172">21:40</text><text x="185" y="172">Gyakorlat vége, állomány bent.</text>
      <text x="85" y="222">23:10</text><text x="185" y="222">Telefonos bejelentés: ég a Vitorlásklub, Kikötő s. 4.</text>
      <text x="85" y="272">23:14</text><text x="185" y="272">Kivonulás 2 géppel.</text>
      <text x="85" y="322">23:21</text><text x="185" y="322">Helyszín. Tűz két ponton: iroda + csónakraktár!</text>
      <text x="85" y="372">01:35</text><text x="185" y="372">Eloltva. 1 fő halott (a gondnok, a raktárban).</text>
      <text x="520" y="460">Sz. Gyula pk.</text>
    </g>
    <!-- red circle a later reader drew around the time -->
    <ellipse cx="112" cy="215" rx="42" ry="22" fill="none" stroke="#c0392b" stroke-width="3"/>
  </g>
</svg>
